<!-- Overlay de Loading com fundo semi-transparente -->
<div *ngIf="isLoading" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm">
  <div class="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center">
    <!-- Spinner melhorado -->
    <svg class="custom-spinner h-16 w-16 text-primary-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
    <p class="text-gray-600 font-medium">Processando áudio...</p>
    <div class="mt-2 w-32 h-1 bg-gray-200 rounded-full overflow-hidden">
      <div class="h-full bg-primary-500 rounded-full animate-pulse" style="width: 70%;"></div>
    </div>
  </div>
</div>

<!-- Conteúdo Principal -->
<div class="gradient-bg min-h-screen bg-gradient-to-br from-primary-50 via-white to-primary-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-3">
        Transcrição de Áudio
      </h1>
      <p class="text-gray-600 text-lg leading-relaxed">
        Fale o que você comeu para calcular os macronutrientes
      </p>
    </div>

    <!-- Botão de gravação de áudio -->
    <div class="relative mb-8">
      <div class="mic-button w-32 h-32 md:w-36 md:h-36 rounded-full bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center shadow-2xl transform transition-all duration-300 hover:scale-105 cursor-pointer"
           [class.breathing-effect]="isRecording"
           [class.ring-4]="isRecording"
           [class.ring-primary-300]="isRecording"
           [class.ring-opacity-75]="isRecording"
           (click)="toggleRecording()">
        <div class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-white flex items-center justify-center shadow-inner">
          <span class="material-symbols-outlined text-primary-500 text-4xl md:text-5xl select-none">
            mic
          </span>
        </div>
      </div>
      
      <!-- Animação de pulso quando gravando -->
      <div *ngIf="isRecording" class="absolute inset-0 rounded-full border-4 border-primary-400 animate-ping opacity-75"></div>
    </div>

    <!-- Status de gravação -->
    <div class="text-center mb-8 min-h-[60px] flex items-center justify-center">
      <div *ngIf="isRecording" class="flex items-center space-x-2 bg-red-50 px-4 py-2 rounded-full">
        <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
        <p class="text-red-600 font-semibold">Gravando...</p>
      </div>
      
      <div *ngIf="!isRecording && transcription.transcriptFood" class="transcript-text bg-green-50 p-4 rounded-xl border-l-4 border-green-400">
        <p class="text-green-800 font-medium mb-1">Texto transcrito:</p>
        <p class="text-green-700 italic">{{ transcription.transcriptFood }}</p>
      </div>
      
      <div *ngIf="!isRecording && !transcription.transcriptFood" class="text-gray-500">
        <p>Toque no microfone para começar</p>
      </div>
    </div>

    <!-- Botão de calcular -->
    <button
      class="main-button w-full px-8 py-4 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 rounded-xl text-white font-bold text-lg transition-all duration-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:bg-gradient-to-r disabled:from-gray-400 disabled:to-gray-500 shadow-lg"
      [disabled]="transcription.transcriptFood.length <= 0"
      (click)="navigateToResultados()">
      <span class="flex items-center justify-center space-x-2">
        <span>Calcular Macronutrientes</span>
        <span class="material-symbols-outlined">arrow_forward</span>
      </span>
    </button>
    
    <!-- Dica de uso -->
    <div class="mt-6 text-center">
      <p class="text-xs text-gray-500">
        Dica: Fale de forma clara e pausada para melhor reconhecimento
      </p>
    </div>
  </div>
</div>
