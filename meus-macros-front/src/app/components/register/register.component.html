<div class="min-h-screen bg-gradient-to-br from-primary-50 via-white to-primary-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-gradient-to-br from-primary-400 to-primary-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
        <span class="material-symbols-outlined text-3xl text-white">person_add</span>
      </div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">
        Criar Conta
      </h1>
      <p class="text-gray-600 text-lg leading-relaxed">
        Junte-se a nós e comece sua jornada
      </p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border-l-4 border-red-400 rounded-xl">
      <div class="flex items-center">
        <span class="material-symbols-outlined text-red-400 mr-2">error</span>
        <p class="text-red-700 font-medium">{{ errorMessage }}</p>
      </div>
    </div>

    <!-- Register Form -->
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-6">
      <!-- Name Fields -->
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-2">
          <label for="firstName" class="block text-sm font-semibold text-gray-700">
            Nome
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-xl">person</span>
            </div>
            <input
              type="text"
              id="firstName"
              name="firstName"
              [(ngModel)]="user.firstName"
              required
              placeholder="Nome"
              class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent hover:border-gray-300 transition-all duration-300 bg-white shadow-sm"
            />
          </div>
        </div>
        
        <div class="space-y-2">
          <label for="lastName" class="block text-sm font-semibold text-gray-700">
            Sobrenome
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-xl">badge</span>
            </div>
            <input
              type="text"
              id="lastName"
              name="lastName"
              [(ngModel)]="user.lastName"
              required
              placeholder="Sobrenome"
              class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent hover:border-gray-300 transition-all duration-300 bg-white shadow-sm"
            />
          </div>
        </div>
      </div>

      <!-- Email Field -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-semibold text-gray-700">
          Email
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-gray-400 text-xl">mail</span>
          </div>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="user.email"
            required
            placeholder="Digite seu email"
            class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent hover:border-gray-300 transition-all duration-300 bg-white shadow-sm"
          />
        </div>
      </div>

      <!-- Password Fields -->
      <div class="space-y-4">
        <div class="space-y-2">
          <label for="password" class="block text-sm font-semibold text-gray-700">
            Senha
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-xl">lock</span>
            </div>
            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="user.password"
              required
              placeholder="Digite sua senha"
              class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent hover:border-gray-300 transition-all duration-300 bg-white shadow-sm"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label for="confirmPassword" class="block text-sm font-semibold text-gray-700">
            Confirmar Senha
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-xl">lock_reset</span>
            </div>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              placeholder="Confirme sua senha"
              class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent hover:border-gray-300 transition-all duration-300 bg-white shadow-sm"
            />
          </div>
        </div>
      </div>

      <!-- Register Button -->
      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full px-8 py-4 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 rounded-xl text-white font-bold text-lg transition-all duration-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 shadow-lg flex items-center justify-center gap-2"
      >
        <span class="material-symbols-outlined">person_add</span>
        Criar Conta
      </button>

      <!-- Divider -->
      <div class="relative flex items-center justify-center my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative bg-white px-4 text-sm text-gray-500">
          ou
        </div>
      </div>

      <!-- Login Button -->
      <button
        type="button"
        (click)="goToLogin()"
        class="w-full px-8 py-4 bg-white border-2 border-primary-500 text-primary-600 rounded-xl font-bold text-lg hover:bg-primary-50 transition-all duration-300 transform hover:scale-105 shadow-lg flex items-center justify-center gap-2"
      >
        <span class="material-symbols-outlined">login</span>
        Já tenho conta
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-8 text-center">
      <p class="text-xs text-gray-500">
        Ao criar uma conta, você concorda com nossos termos de uso
      </p>
    </div>
  </div>
</div>
